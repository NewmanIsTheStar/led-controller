<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
  font-family: "Lato", sans-serif;
  font-size: 25px;
}

.sidenav {
  height: 100%;
  width: 160px;
  position: fixed;
  z-index: 1;
  top: 0;
  left: 0;
  background-color: #111;
  overflow-x: hidden;
  padding-top: 120px;
}

.sidenav a {
  padding: 6px 8px 6px 16px;
  text-decoration: none;
  font-size: 25px;
  color: #818181;
  display: block;
}

.sidenav a:hover {
  color: #f1f1f1;
}

.main {
  margin-left: 160px; /* Same as the width of the sidenav */
  font-size: 28px; /* Increased text to enable scrolling */
  input[type='text'] { font-size: 28px; }
  padding: 0px 10px;
}

@media screen and (max-height: 450px) {
  .sidenav {padding-top: 15px;}
  .sidenav a {font-size: 18px;}
}
</style>
</head>
<body>

  <div class="sidenav">
    <a href="/lc_landscape.shtml">LED Control</a>
    <a href="/network.shtml">System</a>    
  </div>

<div class="main">

  <h2>LED Strip Control</h2>  
  <table>
      <form action="/cgi_led_config.shtml">                  
          <tr>
              <td><label for="ledgpio">GPIO</label></td>
              <td><input type="text" size="4" id="lpin" name="lpin" value="<!--#lpin-->"></td>           
          </tr>    
          <tr>
              <td><label for="lednum">Number of LEDs</label></td>
              <td><input type="text" size="4" id="lnum" name="lnum" value="<!--#lnum-->"></td>           
          </tr> 
          <tr>
              <td><label for="ledrgbw">RGBW</label></td>
              <td><input type="checkbox" id="lrgbw" name="lrgbw" value="on" style="height:20px; width:20px; vertical-align: middle;" <!--#lrgbw-->></td>           
          </tr> 
          <tr>
            <td><label for="lpat">Default Pattern</label></td>
            <td><select name="lpat" id="lpat" style="font-size: 28px;">
              <!--#anim0-->
              <!--#anim1-->
              <!--#anim2-->
              <!--#anim3-->
              <!--#anim4-->                                                        
            </select></td>
          </tr>
          <tr>           
            <td><label for="speed">Default transitition delay</label></td>
            <td><input type="text" size="4" id="lspd" name="lspd" value="<!--#lspd-->">
            <label>cycles</label></td>  
          </tr>           
          <tr>            
              <td>
                  <button type="submit" style="font-size: 25px;">Save</button>
              </td>
          </tr>
      </form>
  </table>  
</div>
   
</body>
</html>
